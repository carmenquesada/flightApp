<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyNow | Mi perfil</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-content">
      <div class="logo">&#9992; FlyNow</div>
      <nav class="nav">
        <a href="/busquedaVuelos.html">Buscar vuelos</a>
        <a href="/misReservas.html">Mis reservas</a>
        <a href="/ofertas.html">Ofertas</a>
        <a href="/ayuda.html">Ayuda</a>
        <a href="/perfil.html" class="profile-link" title="Mi perfil">&#128100;</a>
        <a href="#" id="logoutLink">Cerrar sesion</a>
      </nav>
    </div>
  </header>

  <main class="profile-page">
    <section class="page-hero">
      <div class="container">
        <span class="hero-badge">Cuenta de usuario</span>
        <h1>Mi perfil</h1>
        <p>Consulta la informaci&oacute;n de tu cuenta en FlyNow.</p>
      </div>
    </section>

    <section class="profile-section">
      <div class="container">
        <article class="profile-card-page">
          <div class="profile-avatar">&#128100;</div>
          <h2 id="profileName">-</h2>
          <p class="profile-subtitle">Usuario registrado en FlyNow</p>

          <div class="profile-info-grid">
            <div class="profile-info-item">
              <span>Email</span>
              <strong id="profileEmail">-</strong>
            </div>

            <div class="profile-info-item">
              <span>Telefono</span>
              <strong id="profilePhone">-</strong>
            </div>

            <div class="profile-info-item">
              <span>Fecha de alta</span>
              <strong id="profileCreatedAt">-</strong>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="/assets/js/perfil.js"></script>
</body>
</html>
