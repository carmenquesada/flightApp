<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FlyNow</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: white;
    text-align: center;
}

h2 {
    background-color: blue;
    color: white;
    padding: 15px;
}

#panel{
    background-color: white;
    width: 420px;
    margin: auto;
    padding: 20px;
    border-width: 2px;
    border-style: solid;
}

button {
    background-color: lightblue;
    border-width: 2px;
    border-style: solid;
    padding: 8px;
    margin: 5px;
    width: 200px;
}

#res {
    background-color: white;
    width: 400px;
    margin: auto;
    margin-top: 20px;
    border-width: 2px;
    border-style: solid;
    padding: 15px;
}

</style>

<script>

const BACKEND_URL = "http://localhost:8081/api/flights";

function formatDateTime(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return value;
    }
    return date.toLocaleString();
}

function renderFlights(flights) {
    const container = document.getElementById("res");

    if (!flights || flights.length === 0) {
        container.innerHTML = "<h3>Resultados:</h3><p>No hay vuelos disponibles.</p>";
        return;
    }

    const items = flights.map(function(flight) {
        return "<p>" +
            flight.originIata + " - " + flight.destinationIata +
            " | " + flight.basePrice + " " + flight.currency +
            " | Salida: " + formatDateTime(flight.departureTime) +
            " | Llegada: " + formatDateTime(flight.arrivalTime) +
            " | Plazas: " + flight.availableSeats +
            "</p>";
    }).join("");

    container.innerHTML = "<h3>Resultados:</h3>" + items;
}

async function buscarVuelo() {

    const container = document.getElementById("res");
    container.innerHTML = "<p>Cargando vuelos desde la base de datos...</p>";
    container.style.display = "block";

    try {
        const response = await fetch(BACKEND_URL);
        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const flights = await response.json();
        renderFlights(flights);
        container.style.backgroundColor = "lightblue";
    } catch {
        container.innerHTML =
            "<h3>Error</h3>" +
            "<p>No se pudieron cargar vuelos del backend.</p>" +
            "<p>Asegurate de arrancar primero el backend en http://localhost:8081.</p>";
        container.style.backgroundColor = "#ffe0e0";
    }
}

function borrarResultados() {
    document.getElementById("res").innerHTML = "";
}

function ocultarResultados() {
    document.getElementById("res").style.display = "none";
}

function mostrarResultados() {
    document.getElementById("res").style.display = "block";
}

</script>

</head>

<body>
    
<h2>Buscador simple de vuelos - FlyNow</h2>

<div id = "panel">

<button type = "button" onclick="buscarVuelo()">Buscar vuelos</button>
<br><br>

<button type = "button" onclick="borrarResultados()">Borrar</button>
<br><br>

<button type = "button" onclick="ocultarResultados()">Ocultar resultados</button>
<br><br>

<button type = "button" onclick="mostrarResultados()">Mostrar resultados</button>

</div>

<div id="res">
Resultados aparecerán aquí
</div>

</body>
</html>
