spring.application.name=flightapp-backend

# Carga opcional del archivo local privado (no versionado)
spring.config.import=optional:classpath:application-private.properties

# Conexion local por defecto
spring.datasource.url=jdbc:mysql://localhost:3306/Flightapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL init: recrea esquema y carga datos de prueba en cada arranque
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Evita que Hibernate intente modificar el esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
